<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turkey Run 2.0</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>

  <div class="instructions">
    <h1>🦃 Turkey Run 2.0 🦃</h1>

    <p id="bold-text">
      Avoid pumpkins, duck under crows, and collect corn!
    </p>

    <p id="regular-text">
      Tap or click to jump.
    </p>
  </div>

  <div class="game-container day">

    <div id="score">Score: 0</div>

    <div id="corn-score">
      Corn: 0 🌽
    </div>

    <div id="message">
      Click or Tap to Start
    </div>

    <div id="turkey">
      <span class="turkey-icon">🦃</span>
    </div>

    <div id="obstacle">
      🎃
    </div>

    <div id="airObstacle">
      🦅
    </div>

    <div id="corn">
      🌽
    </div>

  </div>

</body>
</html>
